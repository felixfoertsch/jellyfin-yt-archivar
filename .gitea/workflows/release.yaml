name: Jellyfin edge release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: jellyfin-release
  cancel-in-progress: false

permissions:
  code: read

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 30
    runs-on: linux-builder
    container: gitea/runner-images@sha256:0e62e56b382ebf485bff1e51a05cbe27c708545a2e91425467fd31eb3e249521
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # setup-dotnet v4 unconditionally bootstraps the unrelated LTS runtime first.
      - name: Install pinned .NET SDK (includes its runtime)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sdk="$RUNNER_TEMP/dotnet-sdk.tar.gz"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 480 \
            https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-linux-x64.tar.gz -o "$sdk"
          echo "1033977dd837150e0814cf0c5d5b17ceb63925fda7ba2158b47258a4bd7c048cf82eac3bc1166f3146f53124a3f5fba09db1de1260d2ce96399860303b404b48  $sdk" | sha512sum --check
          mkdir -p "$RUNNER_TEMP/dotnet"
          tar -xzf "$sdk" -C "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/dotnet/dotnet" --version
      - run: python3 scripts/test-release.py
      - run: dotnet run --file scripts/test-configuration.cs -c Release
      - id: identity
        run: echo "tag=v$(date -u +%Y.%m.%d).$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/release.py build "$EDGE_TAG" "$GITHUB_SHA" artifacts
        env:
          EDGE_TAG: ${{ steps.identity.outputs.tag }}
      # Gitea-compatible v4 fork, also used by belt, Vigil and memory.
      - uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: jellyfin-edge
          path: artifacts/*
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'felixfoertsch/jellyfin-yt-archivar'
    needs: build
    runs-on: linux-builder
    container: gitea/runner-images@sha256:0e62e56b382ebf485bff1e51a05cbe27c708545a2e91425467fd31eb3e249521
    permissions:
      code: read
      releases: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: jellyfin-edge
          path: artifacts
      - run: python3 scripts/release.py verify "$EDGE_TAG" "$GITHUB_SHA" artifacts
        env:
          EDGE_TAG: ${{ needs.build.outputs.tag }}
      - run: python3 scripts/release.py publish "$EDGE_TAG" "$GITHUB_SHA" artifacts
        env:
          EDGE_TAG: ${{ needs.build.outputs.tag }}
          GITEA_TOKEN: ${{ github.token }}

  # Keep repository writes out of the release publisher's token.
  catalog:
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'felixfoertsch/jellyfin-yt-archivar'
    needs: [build, publish]
    runs-on: linux-builder
    container: gitea/runner-images@sha256:0e62e56b382ebf485bff1e51a05cbe27c708545a2e91425467fd31eb3e249521
    permissions:
      code: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: jellyfin-edge
          path: artifacts
      - run: python3 scripts/release.py publish_catalog "$EDGE_TAG" "$GITHUB_SHA" artifacts
        env:
          EDGE_TAG: ${{ needs.build.outputs.tag }}
          GITEA_TOKEN: ${{ github.token }}
